<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Semantica 能力引导图</title>
  <desc id="desc">从资料来源建立实体关系，经过冲突检测、规则校验和来源追踪，形成可核对的决策上下文。所有示例数据为本项目虚构。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101c25"/>
      <stop offset="0.56" stop-color="#142b34"/>
      <stop offset="1" stop-color="#0d1923"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7f6d1"/>
      <stop offset="1" stop-color="#70dac9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#02090d" flood-opacity=".32"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#c5e5e1" stroke-opacity=".055"/>
    </pattern>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif}
      .tiny{font-size:15px;letter-spacing:2px;fill:#9eb6bb}
      .label{font-size:16px;font-weight:700;fill:#c9e3df}
      .small{font-size:17px;fill:#a7c0c2}
      .node{font-size:18px;font-weight:700;fill:#edf8f2}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <circle cx="800" cy="310" r="320" fill="#77d9bd" opacity=".045"/>
  <circle cx="1120" cy="690" r="250" fill="#f8be79" opacity=".04"/>
  <rect x="54" y="44" width="154" height="34" rx="17" fill="#c5f5d8"/>
  <text x="75" y="67" fill="#143129" font-size="16" font-weight="800">PROJECT 011</text>
  <text x="54" y="146" fill="#f4faf4" font-size="58" font-weight="800">让答案带着关系</text>
  <text x="54" y="213" fill="url(#mint)" font-size="58" font-weight="800">与证据出现</text>
  <text x="56" y="260" class="small">Semantica · 知识图谱 / 规则 / 来源追踪 / 决策上下文</text>
  <line x1="54" y1="296" x2="1226" y2="296" stroke="#d1eee2" stroke-opacity=".2"/>

  <text x="62" y="337" class="tiny">01 / 多来源资料</text>
  <text x="520" y="337" class="tiny">02 / 上下文图谱</text>
  <text x="983" y="337" class="tiny">03 / 可核对的效果</text>

  <g filter="url(#shadow)">
    <rect x="54" y="358" width="288" height="80" rx="18" fill="#21343d" stroke="#48636a"/>
    <rect x="54" y="452" width="288" height="80" rx="18" fill="#21343d" stroke="#48636a"/>
    <rect x="54" y="546" width="288" height="80" rx="18" fill="#21343d" stroke="#48636a"/>
  </g>
  <rect x="70" y="375" width="46" height="46" rx="12" fill="#d5efe6"/>
  <text x="83" y="405" fill="#235246" font-size="23">▤</text>
  <text x="132" y="391" class="node">审查报告</text>
  <text x="132" y="418" class="small">SSO 与 DPA 状态</text>
  <rect x="70" y="469" width="46" height="46" rx="12" fill="#f8dfc0"/>
  <text x="83" y="499" fill="#855a2f" font-size="23">✉</text>
  <text x="132" y="485" class="node">销售邮件</text>
  <text x="132" y="512" class="small">另一条事实声明</text>
  <rect x="70" y="563" width="46" height="46" rx="12" fill="#cfe0f1"/>
  <text x="83" y="593" fill="#345d80" font-size="23">§</text>
  <text x="132" y="579" class="node">选型规则</text>
  <text x="132" y="606" class="small">两项条件必须满足</text>

  <path d="M343 398 C402 398 420 445 475 459" fill="none" stroke="#82d9c7" stroke-width="3" stroke-opacity=".65"/>
  <path d="M343 492 C398 492 426 492 475 493" fill="none" stroke="#eab97e" stroke-width="3" stroke-opacity=".65"/>
  <path d="M343 586 C408 586 427 543 475 527" fill="none" stroke="#b3d7ef" stroke-width="3" stroke-opacity=".65"/>
  <circle cx="460" cy="493" r="135" fill="#8fd8cb" opacity=".07"/>
  <g filter="url(#shadow)">
    <rect x="475" y="381" width="400" height="227" rx="28" fill="#1b363b" stroke="#78b6aa" stroke-width="2"/>
  </g>
  <circle cx="566" cy="456" r="29" fill="#b9f3d7"/>
  <circle cx="774" cy="456" r="29" fill="#f4d6b5"/>
  <circle cx="670" cy="550" r="29" fill="#c7dff1"/>
  <path d="M595 456H745M585 477L650 533M754 479L691 532" stroke="#89baa9" stroke-width="3"/>
  <text x="530" y="419" class="label">实体 · 关系 · 事实 · 来源</text>
  <text x="535" y="463" fill="#214a3d" font-size="17" font-weight="800">供应商</text>
  <text x="749" y="463" fill="#71492f" font-size="17" font-weight="800">决策</text>
  <text x="644" y="556" fill="#2f5471" font-size="17" font-weight="800">规则</text>
  <text x="537" y="593" class="small">图上的每条结论都有可追的路径</text>

  <path d="M876 492H941" stroke="#b8ead4" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M934 484L946 492L934 500" fill="none" stroke="#b8ead4" stroke-width="3"/>
  <g filter="url(#shadow)">
    <rect x="973" y="358" width="254" height="61" rx="15" fill="#d8f6e3"/>
    <rect x="973" y="429" width="254" height="61" rx="15" fill="#f7e4ca"/>
    <rect x="973" y="500" width="254" height="61" rx="15" fill="#d6e8f4"/>
    <rect x="973" y="571" width="254" height="61" rx="15" fill="#dbeedc"/>
  </g>
  <text x="995" y="397" fill="#1e5140" font-size="20" font-weight="800">关系检索</text>
  <text x="995" y="468" fill="#775231" font-size="20" font-weight="800">冲突保留</text>
  <text x="995" y="539" fill="#315977" font-size="20" font-weight="800">规则校验</text>
  <text x="995" y="610" fill="#315b3d" font-size="20" font-weight="800">决策溯源</text>
  <text x="54" y="677" fill="#9eb8b9" font-size="15">本仓库原创能力示意图 · 虚构数据 · 不是 Semantica 运行截图</text>
</svg>
