<rect x="0" y="0" width="1600" height="2940" rx="0" fill="#f4f6ed" stroke="none"/>
<rect x="0" y="0" width="1600" height="220" rx="0" fill="#203e31" stroke="none"/>
<text x="48" y="49" font-size="20" fill="#a9c493" font-weight="700">011 / SEMANTICA · 完整理解与使用引导</text>
<text x="48" y="115" font-size="47" fill="#f3f8e9" font-weight="700">让资料成为有关系、有来源、能复用的知识。</text>
<text x="48" y="166" font-size="22" fill="#b2c5a3" font-weight="400">能力 → 模块 → 使用场景 → 接入方式 → 实际效果 → 对我们的意义 → 扩展方向</text>
<text x="48" y="197" font-size="17" fill="#849d77" font-weight="400">说明图由本项目整理  /  官方能力与本地实测分开标注  /  实测 Semantica 0.7.0</text>
<text x="48" y="267" font-size="20" fill="#8da67a" font-weight="700">01</text>
<text x="101" y="267" font-size="29" fill="#2a513b" font-weight="700">先理解：图模型相通，产品与处理机制各有侧重。</text>
<rect x="48" y="293" width="730" height="151" rx="14" fill="#fbfcf7" stroke="#d3dfc7"/>
<rect x="800" y="293" width="752" height="151" rx="14" fill="#e6efda" stroke="#d3dfc7"/>
<text x="71" y="332" font-size="26" fill="#365b3e" font-weight="700">Obsidian：笔记、属性与内部链接</text>
<text x="71" y="369" font-size="22" fill="#687c5f" font-weight="400">直接读写和整理知识；Bases 可按属性筛选笔记，关系图用于浏览连</text>
<text x="71" y="402" font-size="22" fill="#687c5f" font-weight="400">接。</text>
<text x="824" y="332" font-size="25" fill="#365b3e" font-weight="700">Semantica：知识处理与查询组件</text>
<text x="824" y="369" font-size="22" fill="#687c5f" font-weight="400">抽取、关系与规则需配置验证。本例人工整理与笔记方式有较大重合，额</text>
<text x="824" y="402" font-size="22" fill="#687c5f" font-weight="400">外收益尚未测定。</text>
<text x="48" y="494" font-size="20" fill="#8da67a" font-weight="700">02</text>
<text x="101" y="494" font-size="29" fill="#2a513b" font-weight="700">完整流程：每一步都有输入，也要留下可检查的产物。</text>
