<text x="68" y="1316" font-size="19" fill="#748969" font-weight="400">保存图、三元组与向量，服务后续查询。</text>
<text x="68" y="1344" font-size="16" fill="#93a385" font-weight="400">graph_store / triplet_store</text>
<text x="68" y="1366" font-size="16" fill="#93a385" font-weight="400">vector_store / embeddings</text>
