<text x="1088" y="1384" font-size="16" fill="#937c52" font-weight="400">待实测</text>
<text x="48" y="1460" font-size="20" fill="#8da67a" font-weight="700">04</text>
<text x="101" y="1460" font-size="29" fill="#2a513b" font-weight="700">使用场景：跨资料找关系，同时说明答案依据。</text>
<rect x="48" y="1486" width="484" height="193" rx="14" fill="#e9efdf" stroke="#d3dfc7"/>
<text x="68" y="1522" font-size="26" fill="#3d6341" font-weight="700">研究工作</text>
<text x="68" y="1558" font-size="21" fill="#687c5f" font-weight="400">跨项目检索 · 结论追溯</text>
<text x="68" y="1589" font-size="21" fill="#687c5f" font-weight="400">资料更新影响 · 持续研究助手</text>
<text x="68" y="1630" font-size="18" fill="#869978" font-weight="400">输入：README、研究与验证记录</text>
<text x="68" y="1660" font-size="18" fill="#869978" font-weight="400">产物：项目角色、证据和复核清单</text>
<rect x="558" y="1486" width="484" height="193" rx="14" fill="#e9efdf" stroke="#d3dfc7"/>
<text x="578" y="1522" font-size="26" fill="#3d6341" font-weight="700">团队协作</text>
<text x="578" y="1558" font-size="21" fill="#687c5f" font-weight="400">多 Agent 协作 · 客服排查</text>
<text x="578" y="1589" font-size="21" fill="#687c5f" font-weight="400">事故复盘 · 依赖风险定位</text>
<text x="578" y="1630" font-size="18" fill="#869978" font-weight="400">输入：任务、工单、版本和依赖</text>
<text x="578" y="1660" font-size="18" fill="#869978" font-weight="400">产物：关联路径与交接上下文</text>
<rect x="1068" y="1486" width="484" height="193" rx="14" fill="#e9efdf" stroke="#d3dfc7"/>
<text x="1088" y="1522" font-size="26" fill="#3d6341" font-weight="700">业务应用</text>
<text x="1088" y="1558" font-size="21" fill="#687c5f" font-weight="400">供应商选型 · 审批审计</text>
<text x="1088" y="1589" font-size="21" fill="#687c5f" font-weight="400">供应链追踪 · 跨系统实体对齐</text>
<text x="1088" y="1630" font-size="18" fill="#869978" font-weight="400">输入：合同、规则、批次和客户记录</text>
<text x="1088" y="1660" font-size="18" fill="#869978" font-weight="400">产物：候选、冲突、依据和决策记录</text>
<text x="50" y="1711" font-size="18" fill="#957d52" font-weight="400">验证范围：已跑通研究检索与证据回查；其他场景为扩展设想，供应商部分仅为概念演示。</text>
<text x="48" y="1773" font-size="20" fill="#8da67a" font-weight="700">05</text>
<text x="101" y="1773" font-size="29" fill="#2a513b" font-weight="700">如何使用</text>
<text x="827" y="1773" font-size="29" fill="#2a513b" font-weight="700">06  最终效果与沉淀</text>
<rect x="48" y="1800" width="730" height="267" rx="14" fill="#fbfcf7" stroke="#d3dfc7"/>
<rect x="800" y="1800" width="752" height="267" rx="14" fill="#fbfcf7" stroke="#d3dfc7"/>
<text x="70" y="1840" font-size="22" fill="#67825b" font-weight="400">1. 定一个具体问题，挑可信的小样本资料。</text>
<text x="70" y="1876" font-size="22" fill="#67825b" font-weight="400">2. 定义对象、关系和必须保留的来源。</text>
<text x="70" y="1912" font-size="22" fill="#67825b" font-weight="400">3. 配置抽取或人工确认，复核错漏与冲突。</text>
<text x="70" y="1948" font-size="22" fill="#67825b" font-weight="400">4. 保存并重载图谱，用固定问题验证查询。</text>
<text x="70" y="1984" font-size="22" fill="#67825b" font-weight="400">5. 生成图形或简报，再评估持续接入业务。</text>
<text x="70" y="2041" font-size="19" fill="#94a182" font-weight="400">本例入口：网页五步流程 + 输入清单 + 本机服务</text>
<text x="824" y="1842" font-size="26" fill="#44784c" font-weight="700">4 份 README · 12 个节点 · 10 条关系</text>
<text x="824" y="1885" font-size="21" fill="#748a65" font-weight="400">搜“记忆” → Hindsight → 原文依据</text>
<text x="824" y="1923" font-size="21" fill="#748a65" font-weight="400">原文快照 / 证据记录 / 图谱 / 运行记录</text>
<text x="824" y="1961" font-size="21" fill="#748a65" font-weight="400">库生成四种图形视图；应用生成研究简报</text>
<text x="824" y="1999" font-size="21" fill="#748a65" font-weight="400">长标签易拥挤；尚未测出效率或准确率提升</text>
<text x="48" y="2127" font-size="20" fill="#8da67a" font-weight="700">07</text>
<text x="101" y="2127" font-size="29" fill="#2a513b" font-weight="700">对我的意义：为持续整理的 GitHub 研究集提供知识底座。</text>
<rect x="48" y="2153" width="1504" height="147" rx="14" fill="#223f31" stroke="none"/>
<text x="73" y="2197" font-size="26" fill="#d8e9c5" font-weight="700">找项目</text>
<text x="73" y="2237" font-size="21" fill="#a3bd8d" font-weight="400">按能力找候选，并一起取回依据。</text>
<text x="576" y="2197" font-size="26" fill="#d8e9c5" font-weight="700">管结论</text>
<text x="576" y="2237" font-size="21" fill="#a3bd8d" font-weight="400">保留来源版本，资料变更后复核。</text>
<text x="1079" y="2197" font-size="26" fill="#d8e9c5" font-weight="700">交接任务</text>
<text x="1079" y="2237" font-size="21" fill="#a3bd8d" font-weight="400">把已核对知识交给后续研究或 Agent。</text>
<text x="48" y="2360" font-size="20" fill="#8da67a" font-weight="700">08</text>
<text x="101" y="2360" font-size="29" fill="#2a513b" font-weight="700">可扩展方向：先量收益，再增加自动化与规模。</text>
<text x="1399" y="2360" font-size="17" fill="#859775" font-weight="400">建议路线，尚未完成</text>
<rect x="48" y="2387" width="484" height="134" rx="14" fill="#fbfcf7" stroke="#d3dfc7"/>
<text x="68" y="2424" font-size="22" fill="#3e6743" font-weight="700">01  扩大样本，先量收益</text>
<text x="68" y="2459" font-size="20" fill="#687c5f" font-weight="400">量正确率、找证据用时与维护成本。</text>
<text x="68" y="2499" font-size="17" fill="#8a9a7b" font-weight="400">产物：问题集、人工答案与基线记录</text>
<rect x="558" y="2387" width="484" height="134" rx="14" fill="#fbfcf7" stroke="#d3dfc7"/>
<text x="578" y="2424" font-size="22" fill="#3e6743" font-weight="700">02  验证中文自动抽取</text>
<text x="578" y="2459" font-size="20" fill="#687c5f" font-weight="400">查漏抽、错抽、无依据关系与费用。</text>
