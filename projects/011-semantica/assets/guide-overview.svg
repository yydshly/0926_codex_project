<text x="578" y="1149" font-size="19" fill="#748969" font-weight="400">组织节点、关系、属性和决策记录。</text>
<text x="578" y="1177" font-size="16" fill="#93a385" font-weight="400">kg / context</text>
<text x="578" y="1217" font-size="16" fill="#937c52" font-weight="400">部分实测</text>
