<text x="101" y="891" font-size="29" fill="#2a513b" font-weight="700">主要模块：按职责分为九组，可独立组合。</text>
<text x="1348" y="891" font-size="17" fill="#859775" font-weight="400">具体接口与依赖以版本为准</text>
