<text x="1088" y="1316" font-size="19" fill="#748969" font-weight="400">组织处理流程、服务访问和后续评估。</text>
<text x="1088" y="1344" font-size="16" fill="#93a385" font-weight="400">pipeline / change_management / evals</text>
