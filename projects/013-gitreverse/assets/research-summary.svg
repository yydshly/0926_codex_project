<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1510" viewBox="0 0 1600 1510" role="img" aria-labelledby="title desc">
  <title id="title">GitReverse 能力、产物与 Chippy Tea 实测总览</title>
  <desc id="desc">GitReverse 通过公开仓库或网页的可见证据，生成开发提示词；网站路线先生成 design.md。图中说明两种结果的用途、后续编码与实测流程、Chippy Tea 原站与实做首版的差异、适用场景、局限及扩展方向。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091b26"/>
      <stop offset="1" stop-color="#153945"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183c49"/>
      <stop offset="1" stop-color="#102d39"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#9fd6d0" stroke-width="2"/>
    </marker>
    <style>
      .text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#f4fbfb}
      .muted{fill:#bdd1d3}
      .teal{fill:#86d9c9}
      .purple{fill:#d4b9eb}
      .amber{fill:#f5ca74}
      .small{font-size:20px}
      .body{font-size:23px}
      .label{font-size:24px;font-weight:700}
      .section{font-size:20px;font-weight:800;letter-spacing:2px}
      .card-title{font-size:31px;font-weight:800}
      .arrow{stroke:#9fd6d0;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1510" fill="url(#background)"/>
  <circle cx="1468" cy="70" r="240" fill="#2aa598" opacity=".08"/>
  <circle cx="60" cy="1450" r="290" fill="#8e68aa" opacity=".09"/>

  <text x="60" y="72" class="text" font-size="49" font-weight="800">GitReverse：把可见线索改写成开发需求草稿</text>
  <text x="62" y="113" class="text muted body">两个输入路线 · 两种文字产物 · 一次网页落地实测</text>
  <text x="62" y="154" class="text muted small">配套能力：可分享路径；配置后可缓存结果、进行库页检索</text>
  <rect x="1233" y="124" width="307" height="43" rx="21" fill="#264450" stroke="#5f9294"/>
  <text x="1252" y="153" class="text small">推断结果 ≠ 作者原始提示词</text>

  <text x="60" y="193" class="text teal section">01 / 能力与底层原理</text>
  <rect x="60" y="211" width="725" height="258" rx="22" fill="url(#card)" stroke="#458e90" stroke-width="2"/>
  <rect x="815" y="211" width="725" height="258" rx="22" fill="#262f47" stroke="#8f75b0" stroke-width="2"/>
  <text x="88" y="257" class="text card-title">路线 A · 公开仓库</text>
  <text x="843" y="257" class="text card-title">路线 B · 网站页面</text>
  <text x="88" y="291" class="text muted small">读取有限 GitHub 资料，概括产品需求</text>
  <text x="843" y="291" class="text muted small">采集网页内容与品牌线索，再请模型归纳</text>

  <rect x="88" y="317" width="188" height="72" rx="10" fill="#255865"/>
  <rect x="325" y="317" width="188" height="72" rx="10" fill="#255865"/>
  <rect x="562" y="317" width="188" height="72" rx="10" fill="#255865"/>
  <text x="108" y="361" class="text label">仓库 URL</text>
  <text x="344" y="361" class="text label">GitHub API</text>
  <text x="581" y="361" class="text label">大模型归纳</text>
  <path d="M283 353 H314" class="arrow"/>
  <path d="M520 353 H551" class="arrow"/>
  <text x="88" y="430" class="text muted small">证据：元数据 · README 前 8,000 字 · 根目录一层文件树</text>

  <rect x="843" y="317" width="188" height="72" rx="10" fill="#59486e"/>
  <rect x="1080" y="317" width="188" height="72" rx="10" fill="#59486e"/>
  <rect x="1317" y="317" width="188" height="72" rx="10" fill="#59486e"/>
  <text x="863" y="361" class="text label">网站 URL</text>
  <text x="1099" y="347" class="text" font-size="22" font-weight="700">文字与品牌</text>
  <text x="1099" y="374" class="text" font-size="19">Firecrawl 等</text>
  <text x="1337" y="347" class="text" font-size="22" font-weight="700">先设计说明</text>
  <text x="1337" y="374" class="text" font-size="19">再写提示词</text>
  <path d="M1038 353 H1069" class="arrow"/>
  <path d="M1275 353 H1306" class="arrow"/>
  <text x="843" y="430" class="text muted small">证据受页面可访问性与采集结果限制</text>

  <text x="60" y="515" class="text teal section">02 / 两种产物分别有什么用</text>
  <rect x="60" y="535" width="725" height="205" rx="22" fill="#113a43" stroke="#3f9b91" stroke-width="2"/>
  <rect x="815" y="535" width="725" height="205" rx="22" fill="#342f4d" stroke="#8f75b0" stroke-width="2"/>
  <text x="90" y="588" class="text card-title">提示词＝“做什么”</text>
  <text x="845" y="588" class="text card-title">design.md＝“大致怎么画”</text>
  <text x="90" y="631" class="text body">给编程助手使用的内容与功能任务草稿</text>
  <text x="90" y="671" class="text muted body">仓库路线、网站路线都能生成</text>
  <text x="845" y="631" class="text body">颜色、字体、组件、布局的模型推断</text>
  <text x="845" y="671" class="text muted body">仅网站路线生成；不是精确视觉稿</text>
  <rect x="90" y="695" width="342" height="26" rx="13" fill="#27635f"/>
  <text x="104" y="714" class="text" font-size="16" font-weight="700">结果仍要由开发者写代码并验证</text>
  <rect x="845" y="695" width="328" height="26" rx="13" fill="#59476f"/>
  <text x="859" y="714" class="text" font-size="16" font-weight="700">网站路线：先设计说明，后提示词</text>

  <text x="60" y="786" class="text amber section">03 / Chippy Tea 一次实测：从结果做出网页，再与原站对比</text>
  <rect x="60" y="805" width="470" height="156" rx="20" fill="#15473f" stroke="#55b399" stroke-width="2"/>
  <rect x="565" y="805" width="470" height="156" rx="20" fill="#50422e" stroke="#d8aa5c" stroke-width="2"/>
  <rect x="1070" y="805" width="470" height="156" rx="20" fill="#48343b" stroke="#bc788a" stroke-width="2"/>
  <text x="90" y="854" class="text" font-size="29" font-weight="800">内容方向：抓住了</text>
  <text x="90" y="893" class="text body">用途、下载入口、人工审查</text>
  <text x="90" y="930" class="text muted small">足以起草第一版产品介绍页</text>
  <text x="595" y="854" class="text" font-size="29" font-weight="800">视觉布局：有明显偏差</text>
  <text x="595" y="893" class="text body">双栏、黄色按钮、手绘风遗漏</text>
  <text x="595" y="930" class="text muted small">需截图、素材与逐轮视觉校对</text>
  <text x="1100" y="854" class="text" font-size="29" font-weight="800">原生 App：没有生成</text>
  <text x="1100" y="893" class="text body">没有 SwiftUI / Rust 应用代码</text>
  <text x="1100" y="930" class="text muted small">不能凭宣传网页推断内部实现</text>

  <text x="60" y="1001" class="text teal section">04 / 两份文字怎样变成可运行的真实产出</text>
  <rect x="60" y="1022" width="342" height="126" rx="17" fill="#214550" stroke="#4b888e"/>
  <rect x="439" y="1022" width="342" height="126" rx="17" fill="#214550" stroke="#4b888e"/>
  <rect x="818" y="1022" width="342" height="126" rx="17" fill="#214550" stroke="#4b888e"/>
  <rect x="1197" y="1022" width="343" height="126" rx="17" fill="#214550" stroke="#4b888e"/>
  <path d="M408 1085 H430" class="arrow"/>
  <path d="M787 1085 H809" class="arrow"/>
  <path d="M1166 1085 H1188" class="arrow"/>
  <text x="83" y="1064" class="text label">① 取回两份结果</text>
  <text x="83" y="1095" class="text muted" font-size="18">提示词 + design.md</text>
  <text x="83" y="1122" class="text muted" font-size="18">先核对原站与输出内容</text>
  <text x="462" y="1064" class="text label">② 交给编程助手</text>
  <text x="462" y="1095" class="text muted" font-size="18">写出 HTML / CSS / JS</text>
  <text x="462" y="1122" class="text muted" font-size="18">开发者补足资源与交互</text>
  <text x="841" y="1064" class="text label">③ 运行网页</text>
  <text x="841" y="1095" class="text muted" font-size="18">检查电脑与手机布局</text>
  <text x="841" y="1122" class="text muted" font-size="18">实际点击并排查错误</text>
  <text x="1220" y="1064" class="text label">④ 与原站比较</text>
  <text x="1220" y="1095" class="text muted" font-size="18">同尺寸截图 + 差异清单</text>
  <text x="1220" y="1122" class="text muted" font-size="18">迭代视觉、内容与体验</text>
  <text x="62" y="1186" class="text amber" font-size="20" font-weight="700">本次右侧实做网页由我们依据文字结果继续开发；GitReverse 本身没有直接交付网页代码。</text>

  <text x="60" y="1232" class="text teal section">05 / 场景、边界、扩展方向与对你的价值</text>
  <rect x="60" y="1252" width="470" height="194" rx="20" fill="#17443f" stroke="#55b399" stroke-width="2"/>
  <rect x="565" y="1252" width="470" height="194" rx="20" fill="#453d32" stroke="#d8aa5c" stroke-width="2"/>
  <rect x="1070" y="1252" width="470" height="194" rx="20" fill="#3d374e" stroke="#a38abc" stroke-width="2"/>
  <text x="86" y="1298" class="text" font-size="28" font-weight="800">适合：快速形成方向</text>
  <text x="86" y="1334" class="text body">项目初筛、原型需求</text>
  <text x="86" y="1368" class="text body">产品介绍页的第一版</text>
  <text x="86" y="1410" class="text muted" font-size="18">把模糊线索变成可讨论的草稿</text>
  <text x="591" y="1298" class="text" font-size="28" font-weight="800">边界：不能直接断定</text>
  <text x="591" y="1334" class="text body">原作者提示词、内部实现</text>
  <text x="591" y="1368" class="text body">或高保真网页复刻质量</text>
  <text x="591" y="1410" class="text muted" font-size="18">仍需源码、截图和交互验证</text>
  <text x="1096" y="1298" class="text" font-size="28" font-weight="800">对你：研究加速器</text>
  <text x="1096" y="1334" class="text body">先生成假设，再核对证据</text>
  <text x="1096" y="1368" class="text body">扩展：引文、版本、视觉评测</text>
  <text x="1096" y="1410" class="text muted" font-size="18">正式入库还要检查许可证与效果</text>
  <text x="62" y="1482" class="text muted" font-size="18">Chippy Tea 是一次样本，并非总体准确率统计。网页下方附真实原站与我们的实做首版截图。</text>
</svg>
