  <rect x="462" y="281" width="656" height="84" rx="10" class="darkrow"/>
  <rect x="480" y="298" width="48" height="48" rx="10" fill="#b7f06a"/><text x="504" y="330" class="mono" fill="#17312c" text-anchor="middle" font-size="20" font-weight="700">1</text>
  <text x="546" y="312" class="zh white" font-size="22" font-weight="700">加载器：把文件映射成程序</text>
  <text x="546" y="341" class="zh" fill="#a8cec3" font-size="17">识别格式、节区、地址、符号与可用数据</text>

  <path d="M788 367V375" stroke="#86cfa7" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="462" y="377" width="656" height="84" rx="10" class="darkrow"/>
  <rect x="480" y="394" width="48" height="48" rx="10" fill="#b7f06a"/><text x="504" y="426" class="mono" fill="#17312c" text-anchor="middle" font-size="20" font-weight="700">2</text>
  <text x="546" y="408" class="zh white" font-size="22" font-weight="700">SLEIGH：解释处理器指令</text>
  <text x="546" y="437" class="zh" fill="#a8cec3" font-size="17">机器码 → 汇编指令 + 统一语义 p-code</text>

  <path d="M788 463V471" stroke="#86cfa7" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="462" y="473" width="656" height="84" rx="10" class="darkrow"/>
  <rect x="480" y="490" width="48" height="48" rx="10" fill="#b7f06a"/><text x="504" y="522" class="mono" fill="#17312c" text-anchor="middle" font-size="20" font-weight="700">3</text>
  <text x="546" y="504" class="zh white" font-size="22" font-weight="700">分析器：连接证据</text>
  <text x="546" y="533" class="zh" fill="#a8cec3" font-size="17">恢复函数、交叉引用、控制流与数据流</text>

  <path d="M788 559V567" stroke="#86cfa7" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="462" y="569" width="656" height="84" rx="10" class="darkrow"/>
  <rect x="480" y="586" width="48" height="48" rx="10" fill="#b7f06a"/><text x="504" y="618" class="mono" fill="#17312c" text-anchor="middle" font-size="20" font-weight="700">4</text>
  <text x="546" y="600" class="zh white" font-size="22" font-weight="700">反编译器：形成可读的推断</text>
  <text x="546" y="629" class="zh" fill="#a8cec3" font-size="17">生成类 C 伪代码；与指令、数据人工核对</text>

  <rect x="462" y="671" width="656" height="48" rx="8" fill="#24504b" stroke="#4b8d7b"/>
  <text x="479" y="701" class="zh lime" font-size="17" font-weight="700">旁路：调试器</text>
  <text x="621" y="701" class="zh" fill="#cae7d5" font-size="16">观察运行时状态，用动态证据检验静态推断</text>

