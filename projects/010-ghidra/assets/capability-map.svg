<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1700" viewBox="0 0 1600 1700" role="img" aria-labelledby="title description">
  <title id="title">Ghidra 完整引导图：能力、输入输出、原理、扩展、游戏存档实测闭环与使用场景</title>
  <desc id="description">上半部分从输入经过加载器、SLEIGH、p-code、分析器和反编译器到输出，并列出扩展方式及研究价值。下半部分以实际编译的游戏存档客户端为例，从 EXE 与存档输入，经过 PE 识别、函数定位、指令与 p-code、伪代码，走到三份存档的运行核对；另列出未实测的程序初筛、固件和版本比较场景。</desc>
