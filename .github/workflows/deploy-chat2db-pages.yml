name: Publish research sites

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-chat2db-pages.yml"
      - ".github/pages-index.html"
      - "README.md"
      - "projects/001-chat2db/**"
      - "sites/001-chat2db/**"
      - "projects/002-browser-use-web-ui/**"
      - "sites/002-browser-use-web-ui/**"
      - "projects/003-antra/**"
      - "sites/003-antra/**"
      - "projects/004-stemdeck/**"
      - "sites/004-stemdeck/**"
      - "projects/006-vercel-eve/**"
      - "sites/006-vercel-eve/**"
      - "projects/007-palmier-pro/**"
      - "sites/007-palmier-pro/**"
      - "projects/008-oh-my-openagent/**"
      - "sites/008-oh-my-openagent/**"
      - "projects/009-superfile/**"
      - "sites/009-superfile/**"
      - "projects/010-ghidra/**"
      - "sites/010-ghidra/**"
      - "projects/013-gitreverse/**"
      - "sites/013-gitreverse/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Prepare static site
        run: |
          mkdir -p _site/sites _site/projects
          cp -R sites/001-chat2db _site/sites/
          cp -R projects/001-chat2db _site/projects/
          cp -R sites/002-browser-use-web-ui _site/sites/
          cp -R projects/002-browser-use-web-ui _site/projects/
          cp -R sites/003-antra _site/sites/
          cp -R projects/003-antra _site/projects/
          cp -R sites/004-stemdeck _site/sites/
          cp -R projects/004-stemdeck _site/projects/
          cp -R sites/006-vercel-eve _site/sites/
          cp -R projects/006-vercel-eve _site/projects/
          cp -R sites/007-palmier-pro _site/sites/
          cp -R projects/007-palmier-pro _site/projects/
          cp -R sites/008-oh-my-openagent _site/sites/
          cp -R projects/008-oh-my-openagent _site/projects/
          cp -R sites/009-superfile _site/sites/
          cp -R projects/009-superfile _site/projects/
          cp -R sites/010-ghidra _site/sites/
          cp -R projects/010-ghidra _site/projects/
          cp -R sites/013-gitreverse _site/sites/
          cp -R projects/013-gitreverse _site/projects/
          cp README.md _site/README.md
          cp .github/pages-index.html _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
