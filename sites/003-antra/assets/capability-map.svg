    <text x="31" y="49" font-size="20" font-weight="850" fill="#9a6323">D</text>
    <text class="card-title" x="22" y="102">两条旁路入口</text>
    <text class="body" x="22" y="142">本地音频 → 播放 / 分析</text>
    <text class="small" x="22" y="181">播客链接 + Spotify 会话</text>
    <text class="small" x="22" y="211">→ 节目 / 单集下载</text>
