  <text class="title" x="68" y="92">Antra · 完整能力地图</text>
  <text class="subtitle" x="70" y="135">入口 → 内部模块 → 本地出口 → 用户效果与研究价值</text>
  <rect x="1479" y="57" width="251" height="47" rx="23" fill="#dff3e5"/>
  <text x="1500" y="88" font-size="19" font-weight="800" fill="#13684d">003 / 源码研究</text>

  <rect x="64" y="172" width="1672" height="174" rx="23" fill="#0e3026"/>
  <text class="kicker" x="98" y="213">它的本质</text>
  <text class="light-title" x="98" y="260">把“要找哪段录音”转成“可用的本地音乐资产”</text>
  <text class="light-body" x="99" y="305">桌面应用：跨平台识别目标 · 多音源匹配与取得 · 校验、打标、建库 · 播放和分析已取得文件</text>

  <text class="section" x="64" y="407">01 入口：用户向 Antra 交付什么？</text>
  <text class="section-note" x="1075" y="405">链接指定目标；音源与本地文件是另外两类输入</text>

