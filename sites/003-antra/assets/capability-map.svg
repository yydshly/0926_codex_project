    <text class="body" x="22" y="93">内置播放器 · 同步歌词</text>
    <text class="small" x="22" y="129">频谱、响度和频率截止检查</text>
    <text class="small" x="22" y="162">也可交给本地媒体服务器</text>
    <rect x="22" y="185" width="120" height="30" rx="15" fill="#e1f3e7"/>
    <text x="38" y="206" font-size="16" font-weight="800" fill="#187253">结果使用</text>
  </g>

  <text class="section" x="64" y="1825">04 出口与效果：用户最终得到什么？</text>
  <g transform="translate(64 1849)">
    <rect width="540" height="247" rx="20" fill="#d9f3e4" stroke="#9dd5b1" stroke-width="2"/>
    <text class="card-title" x="24" y="52">① 带信息的本地音频文件</text>
    <text class="body" x="24" y="95">FLAC / ALAC / AAC / MP3 等</text>
    <text class="small" x="24" y="133">标题、艺人、专辑、曲号、封面、歌词</text>
    <text class="small" x="24" y="170">按歌手 / 专辑与自定义模板归档</text>
    <text x="24" y="214" font-size="18" font-weight="780" fill="#126b4b">效果：从在线目标变成可保存文件</text>
  </g>
  <g transform="translate(630 1849)">
    <rect width="540" height="247" rx="20" fill="#d9f3e4" stroke="#9dd5b1" stroke-width="2"/>
    <text class="card-title" x="24" y="52">② 可浏览、可播放的本地曲库</text>
    <text class="body" x="24" y="95">内置播放器和歌词视图</text>
    <text class="small" x="24" y="133">目录可供 Navidrome / Plex / Jellyfin</text>
    <text class="small" x="24" y="170">等媒体服务读取；可复查文件质量</text>
    <text x="24" y="214" font-size="18" font-weight="780" fill="#126b4b">效果：拥有可迁移、可复用的曲库</text>
  </g>
  <g transform="translate(1196 1849)">
    <rect width="540" height="247" rx="20" fill="#fff3db" stroke="#e6c88d" stroke-width="2"/>
    <text class="card-title" x="24" y="52">③ 明确的任务结果与旁路产物</text>
    <text class="body" x="24" y="95">成功、失败、重试、历史记录</text>
    <text class="small" x="24" y="133">播客路径可输出 OGG 节目文件</text>
    <text class="small" x="24" y="170">不满足匹配或质量要求时可能失败</text>
    <text x="24" y="214" font-size="18" font-weight="780" fill="#91621e">效果：看见处理状态与缺口</text>
  </g>

  <g transform="translate(64 2133)">
    <rect width="816" height="227" rx="21" fill="#0e392d"/>
    <text x="26" y="51" font-size="29" font-weight="850" fill="#9df2c2">05 对你的意义</text>
    <text x="26" y="94" font-size="21" fill="#e0f4e6">可研究并复用一套多源系统模式：</text>
    <text x="26" y="128" font-size="20" fill="#c5e6d0">统一领域对象 → 适配器 → 身份匹配与决策 → 交付校验。</text>
    <text x="26" y="164" font-size="19" fill="#c5e6d0">下一步可验证匹配正确率、真实质量、标签完整率，</text>
    <text x="26" y="196" font-size="19" fill="#c5e6d0">并扩展来源追溯与“录音 / 发行版”双层身份。</text>
  </g>
  <g transform="translate(900 2133)">
    <rect width="836" height="227" rx="21" fill="#fff" stroke="#d3e2d4" stroke-width="2"/>
    <text x="27" y="50" font-size="29" font-weight="850" fill="#84571d">关键边界与验证状态</text>
    <text x="27" y="91" font-size="20" fill="#47604f">链接不等于音源；ISRC 标识录音，不标识专辑发行版。</text>
    <text x="27" y="126" font-size="20" fill="#47604f">格式选择不证明真实音质；账号、地区、授权影响结果。</text>
    <text x="27" y="161" font-size="20" fill="#47604f">本图依据官方说明与关键源码；未安装或实测下载。</text>
    <text x="27" y="196" font-size="19" fill="#6a786c">软件为 Elastic License 2.0；音乐内容权利需另行判断。</text>
  </g>

