  <text x="119" y="1313" font-size="20" fill="#795b32">Tidal · Qobuz · Amazon Music · Apple Music · Deezer · 镜像与回退 · Soulseek</text>
  <text x="119" y="1351" font-size="18" fill="#8a6a3e">适配器封装可用性、检索与取得；账号、地区、服务健康、限流和授权决定实际结果。</text>

  <text class="section" x="64" y="1502">03 支撑能力：这条链如何持续可用？</text>
  <g transform="translate(64 1525)">
    <rect width="402" height="232" rx="19" fill="#fff" stroke="#d3e3d7" stroke-width="2"/>
    <text class="card-title" x="22" y="52">可视化任务控制</text>
    <text class="body" x="22" y="93">曲目预览 · 实时进度 · 日志</text>
    <text class="small" x="22" y="129">失败曲目收集与单个 / 批量重试</text>
    <text class="small" x="22" y="162">音源状态展示与任务反馈</text>
    <rect x="22" y="185" width="120" height="30" rx="15" fill="#e1f3e7"/>
    <text x="38" y="206" font-size="16" font-weight="800" fill="#187253">桌面交互</text>
  </g>
  <g transform="translate(487 1525)">
    <rect width="402" height="232" rx="19" fill="#fff" stroke="#d3e3d7" stroke-width="2"/>
    <text class="card-title" x="22" y="52">持续更新与记忆</text>
    <text class="body" x="22" y="93">定时同步歌单新增曲目</text>
    <text class="small" x="22" y="129">保存下载会话历史</text>
    <text class="small" x="22" y="162">记住音源可靠性与失败项</text>
    <rect x="22" y="185" width="120" height="30" rx="15" fill="#e1f3e7"/>
    <text x="38" y="206" font-size="16" font-weight="800" fill="#187253">长期维护</text>
  </g>
  <g transform="translate(910 1525)">
    <rect width="402" height="232" rx="19" fill="#fff" stroke="#d3e3d7" stroke-width="2"/>
    <text class="card-title" x="22" y="52">曲库一致性</text>
    <text class="body" x="22" y="93">按 ISRC / ID / 文本去重</text>
    <text class="small" x="22" y="129">完整专辑模式、多碟编号</text>
    <text class="small" x="22" y="162">文件名与文件夹模板</text>
    <rect x="22" y="185" width="120" height="30" rx="15" fill="#e1f3e7"/>
    <text x="38" y="206" font-size="16" font-weight="800" fill="#187253">本地治理</text>
  </g>
  <g transform="translate(1333 1525)">
    <rect width="403" height="232" rx="19" fill="#fff" stroke="#d3e3d7" stroke-width="2"/>
