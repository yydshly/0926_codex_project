<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2460" viewBox="0 0 1800 2460" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Antra 完整能力地图：入口、核心模块、出口、效果与研究价值</title>
  <desc id="map-desc">Antra 是将在线音乐目标转化为本地音乐资产的桌面应用。入口包括音乐链接、已连接的在线曲库、任务策略，以及本地文件或播客旁路。核心处理链为提取曲目、统一目标、解析音源、下载校验、打标归档。辅助能力包括进度与重试、歌单同步、去重和本地播放分析。出口为带标签的音频文件、结构化本地曲库和可见的任务结果。图下方解释对多源系统研究的价值及未实测的边界。</desc>
